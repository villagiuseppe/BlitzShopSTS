name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html config.html styles.css manifest.webmanifest sw.js .nojekyll _site/
          cp -r assets src _site/

      - name: Set published app version
        run: |
          echo "export const APP_VERSION = '1.0.${{ github.run_number }}';" > _site/src/version.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 30); do
            artifact_count=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GH_API_URL}/repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              | jq --arg name "${ARTIFACT_NAME}" '[.artifacts[] | select(.name == $name)] | length')

            if [ "${artifact_count}" -eq 1 ]; then
              echo "Pages artifact is available."
              exit 0
            fi

            if [ "${artifact_count}" -gt 1 ]; then
              echo "::error::Found multiple Pages artifacts named ${ARTIFACT_NAME}."
              exit 1
            fi

            echo "Pages artifact metadata is not available yet (${attempt}/30)."
            sleep 2
          done

          echo "::error::Pages artifact metadata did not become available."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
