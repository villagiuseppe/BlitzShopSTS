<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Static companion app for drawing Merchant wares in Shop Blitz Mode: Standard and Cursed cards."
    />
    <title>Shop Blitz Simulator ·</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">SB</span>
        <div>
          <h1>Shop Blitz Simulator</h1>          
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="panel controls" aria-labelledby="controls-title">
        <h2 id="controls-title">Number of players</h2>

        <fieldset class="player-fieldset">
          <div class="setup-row">
            <div id="player-selector" class="player-selector"></div>
            <div class="button-row">
              <button id="draw-btn" class="btn" type="button">Draw</button>
              <button id="reset-choices-btn" class="btn" type="button">Reset</button>
            </div>
          </div>
        </fieldset>

        <div class="active-player-row">
          <label for="active-player">Active player</label>
          <select id="active-player"></select>
          <span id="active-hint" class="hint">Click a card to purchase it.</span>
        </div>
      </section>

      <section class="panel board">
        <div id="player-statuses" class="player-statuses"></div>
        <div id="ware-board" class="card-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        Fan Made companion app for
        <a href="https://contentiongames.com/games/slay/" target="_blank" rel="noopener noreferrer">Slay the Spire: the Board Game</a>
      </p>
      <span id="app-version"></span>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
