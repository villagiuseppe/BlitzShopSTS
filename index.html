<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Blitz's Shop Simulator: companion app for drawing Merchant wares in Blitz Mode: Standard and Cursed cards."
    />
    <meta name="theme-color" content="#17152a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blitz's Shop" />
    <title>Blitz's Shop Simulator ·</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <img class="brand-icon" src="./assets/icon.svg" alt="" aria-hidden="true" />
        <div>
          <h1>Blitz's Shop Simulator</h1>
        </div>
      </div>
      <a class="settings-link" href="./config.html" aria-label="Game settings" title="Game settings">
        <span aria-hidden="true">⚙</span>
      </a>
    </header>

    <main class="layout">
      <section class="panel controls" aria-labelledby="controls-title">
        <h2 id="controls-title">Number of players</h2>

        <fieldset class="player-fieldset">
          <div class="setup-row">
            <div id="player-selector" class="player-selector"></div>
            <div class="button-row">
              <button id="draw-btn" class="btn btn-primary" type="button">Draw</button>
              <button id="reset-choices-btn" class="btn btn-secondary" type="button">Reset</button>
            </div>
          </div>
        </fieldset>

        <div class="active-player-row">
          <span class="active-player-label">Active player</span>
          <div id="active-player" class="active-player-buttons" role="group" aria-label="Active player"></div>
          <span id="active-hint" class="hint">Click a card to purchase it.</span>
        </div>
      </section>

      <section class="panel board">
        <div id="ware-board" class="card-grid"></div>
      </section>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
